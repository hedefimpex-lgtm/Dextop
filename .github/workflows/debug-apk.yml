name: Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual runs build the signed release APK; keep pushes and pull requests from cancelling them.
  group: debug-apk-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testGithubDebugUnitTest

      - name: Build Debug APK
        run: flutter build apk --flavor github --debug --dart-define=DISTRIBUTION_CHANNEL=github

      - name: Build Dextop Car Companion Debug APK
        working-directory: android
        run: ./gradlew :cardex:assembleDebug

      - name: Upload Nightly APKs
        uses: actions/upload-artifact@v4
        with:
          name: dextop-nightly-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-github-debug.apk
            build/cardex/outputs/apk/debug/cardex-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build signed release APK
    # Manual runs only; pushes and pull requests keep building just the debug APK.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEXTOP_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.DEXTOP_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.DEXTOP_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DEXTOP_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          keystore=android/keystore/release.jks
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the release key from repository secrets."
            # PKCS12 keystores use one password for the store and the key.
            KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}
            if [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASSWORD" ]; then
              echo "::error::DEXTOP_KEY_ALIAS and DEXTOP_STORE_PASSWORD secrets are required with DEXTOP_KEYSTORE_BASE64."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          else
            # No key stored in secrets: sign with a key made for this run only.
            # Installing a later build signed with a different key needs an uninstall first.
            echo "::warning::DEXTOP_KEYSTORE_BASE64 is not set; signing with a one-off key."
            KEY_ALIAS=dextop
            STORE_PASSWORD=$(openssl rand -hex 24)
            KEY_PASSWORD=$STORE_PASSWORD
            keytool -genkeypair -noprompt -keystore "$keystore" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Dextop test build"
          fi
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          # Unlock the private key the way the Gradle signing step will, so a wrong
          # alias or password fails here instead of after the full build.
          cat > "$RUNNER_TEMP/CheckKey.java" <<'JAVA'
          import java.io.File;
          import java.security.KeyStore;

          public class CheckKey {
              public static void main(String[] args) throws Exception {
                  KeyStore store = KeyStore.getInstance(new File(args[0]), System.getenv("STORE_PASSWORD").toCharArray());
                  if (store.getKey(System.getenv("KEY_ALIAS"), System.getenv("KEY_PASSWORD").toCharArray()) == null) {
                      throw new IllegalStateException("alias " + System.getenv("KEY_ALIAS") + " not found in the keystore");
                  }
              }
          }
          JAVA
          export KEY_ALIAS STORE_PASSWORD KEY_PASSWORD
          if ! java "$RUNNER_TEMP/CheckKey.java" "$keystore"; then
            echo "::error::The release key could not be unlocked. Check the DEXTOP_KEY_ALIAS, DEXTOP_STORE_PASSWORD and DEXTOP_KEY_PASSWORD secrets."
            exit 1
          fi
          {
            echo "DEXTOP_KEYSTORE_FILE=$keystore"
            echo "DEXTOP_KEY_ALIAS=$KEY_ALIAS"
            echo "DEXTOP_STORE_PASSWORD=$STORE_PASSWORD"
            echo "DEXTOP_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          keytool -list -v -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "SHA256:|Owner:"

      - name: Build release APK
        run: |
          flutter build apk --flavor github --release --target-platform android-arm64 \
            --dart-define=DISTRIBUTION_CHANNEL=github
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-github-release.apk "dist/Dextop-v${version%%+*}-${GITHUB_SHA::7}.apk"

      - name: Remove signing key
        if: always()
        run: rm -f android/keystore/release.jks

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dextop-release-signed-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
